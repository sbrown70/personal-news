    urls: [https://rss.nytimes.com/services/xml/rss/nyt/World.xml]

  - name: People's Policy Project
    outlet: People's Policy Project
    section: misc
    urls: [https://www.peoplespolicyproject.org/feed/]
    site: https://www.peoplespolicyproject.org

  - name: Marginal Revolution
    outlet: Marginal Revolution
    section: misc
    retention_hours: 72          # several posts a day; don't keep two weeks' worth
    min_title_words: 1           # short titles are normal here ("Sunday assorted links")
    only_authors: [Tyler Cowen]  # no Alex Tabarrok posts
