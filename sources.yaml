# Rules applied only to sources marked `filter: true`.
# All matching is case-insensitive.
filters:
  # Any of these substrings in the article URL drops it.
  url_contains:
    - /opinion/
    - /opinions/
    - cooking.nytimes.com
    - /food/
    - /dining/
    - /recipes/
    - /well/
    - /wellness/
    - /wirecutter/
  # Any of these feed category tags drops it.
  categories:
    - opinion
    - opinions
    - op-ed
    - letters
    - food
    - cooking
    - recipes
    - well
    - wellness
    - fitness
    - nutrition
  # Any of these words or phrases in the headline drops it (whole-word match).
  title_words:
    - opinion
    - guest essay
    - op-ed
    - letters to the editor
    - recipe
    - recipes
    - workout
    - workouts
    - exercises
    - stretches
    - stretching
    - longevity
    - healthy aging
    - as you age
    - live longer
    - dietitian
    - nutritionist
    - "sleep better"

# Shared patterns for story selection (regular expressions, case-insensitive).
selection:
  # Held back from sources with rumor_rules: true (unless by a pass_authors byline).
  rumor_patterns:
    - "\\brumou?rs?\\b"
    - "\\bhot stove\\b"
    - "\\breportedly\\b"
    - "\\binterest(ed)? in\\b"
    - "\\bpursu(e|es|ing|it)\\b"
    - "\\blistening to (trade )?offers\\b"
    - "\\bmeet(s|ing)? with\\b"
    - "\\blinked to\\b"
    - "\\bin the mix\\b"
    - "\\bwhat I'?m hearing\\b"
    - "\\btrade (ideas|candidates|targets)\\b"
    - "\\bhypothetical\\b"
    - "\\bshould (make|target|pursue|sign|trade|add)\\b"
    - "\\bchances? of signing\\b"
    - "\\bfavou?rites? to (sign|land)\\b"
    - "\\blikely to (sign|trade|land)\\b"
    - "\\blanding spots?\\b"
    - "\\bpredictions?\\b"
    - "\\bpower rankings\\b"
    - "\\bmakes? sense\\b"
    - "\\b(might|could)\\b.*\\?$"
  # Scoops and investigations: a single-outlet story with any of these in its
  # headline or summary passes the gate.
  scoop_patterns:
    - "\\bexclusive\\b"
    - "\\bfirst reported\\b"
    - "\\b(a|an) (Times|Post|Athletic|ESPN) (investigation|analysis|examination|review)\\b"
    - "\\binvestigation (found|finds|shows|reveals|by)\\b"
    - "\\b(documents|records|emails|messages) (show|obtained|reviewed|reveal|seen)\\b"
    - "\\bobtained by\\b"
    - "\\baccording to (internal|confidential|previously unreported|documents|records)\\b"
    - "\\bpreviously unreported\\b"
    - "^Sources?\\b"
    - "\\bsources? (say|said|tell|told)\\b"
    - ":\\s*Sources?$"
  # Long-form features: same effect.
  feature_patterns:
    - "^Inside\\b"
    - "\\binside the\\b"
    - "\\bbehind the scenes\\b"
    - "\\boral history\\b"
    - "\\bhow .{3,60} came together\\b"
    - "\\b(the )?(untold|inside) story\\b"
    - "\\bthe making of\\b"
  # URL fragments that mark an editors' pick. WaPo's "The 7" is its morning briefing.
  editor_pick_urls:
    "/the-seven/": "WaPo The 7"

# Headlines matching any of these regular expressions are dropped from EVERY
# source (not just filtered ones). Used for non-story pages that some feeds include.
always_drop_titles:
  - "^View (Interior|Exterior) Photos of"
  - "^Photos: "

# Default for sections that don't set retention_hours.
retention_hours: 72

# Stories scoring at or above this get merged into one card. The score is
# meaning-similarity (0-1) plus lexical_weight x shared-rare-word similarity (0-1).
# Raise it if unrelated stories are being merged; lower it if duplicates slip through.
# 0.70 / 0.3 were tuned on ~350 hand-labelled story pairs (about 94% of merges
# correct, about 80% of true duplicates caught).
similarity_threshold: 0.70
lexical_weight: 0.3

# Stories published further apart than this are never merged.
merge_window_hours: 48
