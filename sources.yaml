# Personal news sources.
#
# Every source here is a PUBLIC RSS/Atom feed. Nothing needs a login.
#
# Fields:
#   name      label shown on the status page
#   outlet    label shown on the link chip (several feeds can share an outlet)
#   section   which tab the story goes in (see `sections` below)
#   urls      one or more candidate feed URLs, tried in order
#   site      (optional) homepage, used to auto-discover a feed if every url fails
#   filter    true = apply the `filters` rules below (used for the NYT/WaPo
#             replacements for the morning-briefing emails). Feeds you picked
#             on purpose, like Ezra Klein's column, are left alone.
#   retention_hours  (optional) overrides the section's retention for this source.
#   priority  (optional) lower = preferred as the headline when stories merge.
#             Defaults to the order in this file.
#   min_title_words  (optional, default 4) shorter headlines are skipped as
#             section pages and teasers. Lower it for blogs with short titles.
#   google_news  true = the urls are Google News searches, used for sites that
#             block automated feed readers. Links go through news.google.com,
#             which forwards you to the article.
#
# Story selection (see `selection` at the bottom for the shared patterns):
#   gate      true = a story that only this outlet covered is shown only if it has
#             an importance signal (front-page placement, an editors'-pick URL,
#             scoop/feature language, an allowed byline or keyword). Stories two or
#             more outlets covered always show. Everything else goes to "Held back".
#   front_page_positions  N = the first N items of this feed count as front-page
#             (NYT's home-page feed is in editors' placement order).
#   rumor_rules  true = drop rumor/speculation headlines (selection.rumor_patterns).
#   drop_titles  regexes for headlines to hold back from this source (clickbait).
#   drop_question_headlines  true = hold back headlines ending in "?".
#   pass_authors  bylines that always show and skip the rumor rules.
#   pass_keywords  regexes; a headline matching one passes the gate.
#
# Dropping entirely (listed under "Filtered out" on the Feeds tab, never shown):
#   only_authors   keep only posts whose byline contains one of these names.
#   exclude_titles regexes; a matching headline is dropped.

sections:
  # retention_hours: how long stories stay. Slow-moving sections keep them longer
  # so a weekly column or monthly issue doesn't vanish before you see it.
  - {id: news,     label: "News",           retention_hours: 72}
  - {id: baseball, label: "Baseball",       retention_hours: 72}
  - {id: cars,     label: "Cars",           retention_hours: 72}
  - {id: misc,     label: "Policy & Ideas", retention_hours: 336}
  - {id: science,  label: "Science",        retention_hours: 336}
  - {id: ai,       label: "AI",             retention_hours: 336}

sources:
  # ---------- Replacements for the morning emails ----------
  - name: NYT Top Stories (replaces the Morning Briefing)
    outlet: NYT
    section: news
    filter: true
    gate: true
    front_page_positions: 6
    urls: [https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml]

  - name: NYT U.S.
    gate: true
    outlet: NYT
    section: news
    filter: true
    urls: [https://rss.nytimes.com/services/xml/rss/nyt/US.xml]

  - name: NYT Politics
    gate: true
    outlet: NYT
    section: news
    filter: true
    urls: [https://rss.nytimes.com/services/xml/rss/nyt/Politics.xml]

  - name: NYT Business
    gate: true
    outlet: NYT
    section: news
    filter: true
    urls: [https://rss.nytimes.com/services/xml/rss/nyt/Business.xml]

  - name: WaPo National (replaces the headlines email)
    gate: true
    outlet: WaPo
    section: news
    filter: true
    urls: [https://feeds.washingtonpost.com/rss/national]

  - name: WaPo Politics
    gate: true
    outlet: WaPo
    section: news
    filter: true
    urls: [https://feeds.washingtonpost.com/rss/politics]

  - name: WaPo World
    gate: true
    outlet: WaPo
    section: news
    filter: true
    urls: [https://feeds.washingtonpost.com/rss/world]

  - name: WaPo Business
    gate: true
    outlet: WaPo
    section: news
    filter: true
    urls: [https://feeds.washingtonpost.com/rss/business]

  - name: WaPo Technology
    gate: true
    outlet: WaPo
    section: news
    filter: true
    urls: [https://feeds.washingtonpost.com/rss/business/technology]

  - name: MLB.com News (replaces MLB Morning Lineup)
    outlet: MLB.com
    section: baseball
    gate: true
    rumor_rules: true
    drop_question_headlines: true
    pass_authors: [David Adler, Mike Petriello, Tom Tango]
    # Reported transactions, hires and injuries pass even when only one outlet has them.
    # Shared with The Athletic MLB and ESPN MLB below (*transactions).
    pass_keywords: &transactions
      - "\\(sources?\\)"                 # "... on 1-year contract (source)"
      - "\\bsources?\\s*$"               # "...: Sources"
      - "\\b\\d+-year\\b"                # "3-year, $48 million deal"
      - "\\bagree(s|d)? (to|on)\\b"
      - "\\bre-signs?\\b"
      - "\\bbring(s|ing)? back\\b"
      - "\\b(joins|joining)\\b"
      - "\\b(to hire|hires|hired|named)\\b"
      - "\\b(surgery|torn|fractured?)\\b"
    urls: [https://www.mlb.com/feeds/news/rss.xml]

  # Listed before "The Athletic MLB" so these own any story that appears in both
  # feeds, which means they skip that feed's rules.
  - name: The Athletic - Eno Sarris
    outlet: The Athletic
    section: baseball
    retention_hours: 336
    urls: [https://www.nytimes.com/athletic/rss/author/eno-sarris/]

  - name: The Athletic - Jesus Cano (Braves beat)
    outlet: The Athletic
    section: baseball
    retention_hours: 168
    urls: [https://www.nytimes.com/athletic/rss/author/jesus-cano/]

  - name: The Athletic MLB (replaces Athletic emails)
    outlet: The Athletic
    section: baseball
    gate: true
    rumor_rules: true
    pass_keywords: *transactions
    urls: [https://www.nytimes.com/athletic/rss/mlb/]

  # ---------- From Feedly: Baseball ----------
  - name: Baseball Prospectus
    outlet: Baseball Prospectus
    section: baseball
    urls: [https://www.baseballprospectus.com/feed/]
    site: https://www.baseballprospectus.com

  - name: ESPN MLB
    outlet: ESPN
    section: baseball
    # ESPN's own MLB feed (espn.com/espn/rss/mlb/news, also sports-ak.espn.go.com) blocks
    # GitHub's servers, so this is the same MLB stories via Google News.
    google_news: true
    gate: true
    rumor_rules: true
    pass_keywords: *transactions
    urls: ["https://news.google.com/rss/search?q=site:espn.com/mlb/story+when:3d&hl=en-US&gl=US&ceid=US:en"]

  - name: FanGraphs
    outlet: FanGraphs
    section: baseball
    urls: [https://blogs.fangraphs.com/feed/]
    site: https://blogs.fangraphs.com

  - name: Tangotiger Blog
    outlet: Tangotiger
    section: baseball
    urls:
      - https://tangotiger.com/index.php/site/atom
      - http://feeds.feedburner.com/tangotiger

  - name: Baseball Observer (research)
    outlet: Baseball Observer
    section: baseball
    # Aggregates baseball research (papers, Substacks, team blogs); slow-moving.
    retention_hours: 336
    urls: ["https://baseball.observer/feed.rss?search=&sort=date&category=research"]

  # ---------- From Feedly: Cars ----------
  - name: Classic Motorsports
    outlet: Classic Motorsports
    section: cars
    # No public feed on the site, and the Google News search covers the whole site,
    # so drop the forum threads, tag pages and member profiles it also picks up.
    google_news: true
    exclude_titles:
      - "\\|[^|]*\\bforums?\\s*\\|?\\s*$"                       # "Meme Thread...| Off-Topic Discussion forum |"
      - "articles, project cars, conversations, and more$"     # tag pages
      - "has posted \\d+ times in the forums"                  # member profiles
    urls: ["https://news.google.com/rss/search?q=site:classicmotorsports.com+when:7d&hl=en-US&gl=US&ceid=US:en"]

  - name: GM Authority
    outlet: GM Authority
    section: cars
    gate: true
    drop_question_headlines: true
    drop_titles:
      - "^Poll:"
      - "\\bDeals? For (January|February|March|April|May|June|July|August|September|October|November|December)\\b"
      - "\\b(Discount|Lease|Financing)\\b"
      - ":\\s*Video$"
      - "Now Available (To|For) Order"
      - "Here[’']s How Much"
      - "May Shock You"
      - "\\bWhich (One|Would)\\b"
      - "\\b(Baojun|Wuling)\\b"
      - "\\bIn (Argentina|Brazil|Peru|Chile|Colombia|Ecuador|Uruguay|Paraguay|Bolivia|Venezuela|Central America|Mexico|China|Korea|South Korea|Australia|Japan|the Middle East|South Africa|Uzbekistan|Europe)\\b"
    # A GM Authority story only it covered still shows if the headline is about
    # the company itself rather than a product or promotion.
    pass_keywords:
      - "\\b(stock|shares|earnings|profit|revenue|quarter(ly)?|Q[1-4]|guidance|dividend|buyback)\\b"
      - "\\b(Barra|CEO|CFO|president|executive|board|leadership|succession)\\b"
      - "\\b(recall|NHTSA|investigation|probe|lawsuit|sues|sued|settlement|fine[ds]?)\\b"
      - "\\b(plant|factory|assembly|production|layoffs?|job cuts|workers|UAW|strike|union)\\b"
      - "\\b(tariffs?|regulation|regulators?|EPA|emissions|Congress|federal|law|bill|provision|rule)\\b"
      - "\\b(invest(s|ment|ing)?|billion|acquisition|partnership|Cruise|autonomous|battery plant)\\b"
      - "\\b(sales (results|report|fell|rose|decline|increase|up|down)|market share)\\b"
    urls: [https://gmauthority.com/blog/feed/]
    site: https://gmauthority.com

  - name: Motor1 News
    outlet: Motor1
    section: cars
    urls: [https://www.motor1.com/rss/news/all/]
    site: https://www.motor1.com

  - name: Car and Driver
    outlet: Car and Driver
    section: cars
    urls: [https://www.caranddriver.com/rss/all.xml/]
    site: https://www.caranddriver.com

  - name: Petrolicious
    outlet: Petrolicious
    section: cars
    urls:
      - https://petrolicious.com/blogs/articles.atom
      - https://petrolicious.com/feed
    site: https://petrolicious.com

  # ---------- From Feedly: Misc ----------
  - name: Bridge Michigan
    outlet: Bridge Michigan
    section: news
    urls:
      - https://www.bridgemi.com/rss.xml
      - https://www.bridgemi.com/feed
    site: https://www.bridgemi.com

  - name: Michigan Advance
    outlet: Michigan Advance
    section: news
    urls: [https://michiganadvance.com/feed/]
    site: https://michiganadvance.com

  - name: NYT Ezra Klein
    outlet: NYT (Ezra Klein)
    section: misc
    urls:
      - https://www.nytimes.com/svc/collections/v1/publish/www.nytimes.com/column/ezra-klein/rss.xml

  - name: NYT The Upshot
    outlet: NYT
    section: news
    urls: [https://rss.nytimes.com/services/xml/rss/nyt/Upshot.xml]

  - name: NYT World News
    outlet: NYT
    section: news
