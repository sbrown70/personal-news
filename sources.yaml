# Rules applied only to sources marked `filter: true`.
# All matching is case-insensitive.
filters:
  # Any of these substrings in the article URL drops it.
  url_contains:
    - /opinion/
    - /opinions/
    - cooking.nytimes.com
    - /food/
    - /dining/
    - /recipes/
    - /well/
    - /wellness/
    - /wirecutter/
  # Any of these feed category tags drops it.
  categories:
    - opinion
    - opinions
    - op-ed
    - letters
    - food
    - cooking
    - recipes
    - well
    - wellness
    - fitness
    - nutrition
  # Any of these words or phrases in the headline drops it (whole-word match).
  title_words:
    - opinion
    - guest essay
    - op-ed
    - letters to the editor
    - recipe
    - recipes
    - workout
    - workouts
    - exercises
    - stretches
    - stretching
    - longevity
    - healthy aging
    - as you age
    - live longer
    - dietitian
    - nutritionist
    - "sleep better"

# How long stories stay on the page.
retention_hours: 72

# Stories whose text similarity is at or above this get merged into one card.
# Raise it if unrelated stories are being merged; lower it if duplicates slip through.
similarity_threshold: 0.62

# Stories published further apart than this are never merged.
merge_window_hours: 48
