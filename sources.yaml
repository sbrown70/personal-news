  - name: NYT The Upshot
    outlet: NYT
    section: news
    urls: [https://rss.nytimes.com/services/xml/rss/nyt/Upshot.xml]

  - name: NYT World News
    outlet: NYT
    section: news
    urls: [https://rss.nytimes.com/services/xml/rss/nyt/World.xml]

  - name: People's Policy Project
    outlet: People's Policy Project
