name: Debug (manual)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs to probe"
        required: false
        default: ""
      dump:
        description: "Dump stories + similarity vectors to the log"
        type: boolean
        default: false
      models:
        description: "Extra embedding models to dump (comma-separated)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe URLs
        if: inputs.urls != ''
        run: python tools/probe.py ${{ inputs.urls }}
      - uses: actions/cache@v4
        if: inputs.dump
        with:
          path: .cache/fastembed
          key: fastembed-debug-v1
      - name: Build with data dump
        if: inputs.dump
        env:
          PREVIOUS_STATE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/items.json
          NEWS_DUMP: "1"
          NEWS_DUMP_MODELS: ${{ inputs.models }}
        run: python build.py
